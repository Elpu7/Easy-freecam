plugins {
    // Quilt Loom still expects mapping artifacts that do not exist for unobfuscated 26.3.
    // Fabric Loom is used only to compile and package the native Quilt mod.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = rootProject.archives_base_name
}

def localElibJar = rootProject.file("../Elib/quilt/build/libs/elib-${project.elib_version}-quilt.jar")

sourceSets {
    main {
        java.srcDirs = [
            rootProject.file('common/src/main/java'),
            rootProject.file('common/src/client/java'),
            file('src/main/java')
        ]
        resources.srcDirs = [
            rootProject.file('common/src/main/resources'),
            rootProject.file('common/src/client/resources'),
            file('src/main/resources')
        ]
    }
}

loom {
    runs {
        client {
            runDir '../../run/quilt'
        }
    }

    mods {
        'easy-freecam' {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Elpu7'
        url = 'https://maven.elpu7.dev/releases'
    }
    maven {
        name = 'Quilt'
        url = 'https://maven.quiltmc.org/repository/release/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"

    implementation localElibJar.exists()
        ? files(localElibJar)
        : "dev.elpu7:elib-quilt:${project.elib_version}"

    // Fabric Loom does not read Quilt Loader's installer metadata. Mirror the
    // libraries declared by Quilt Loader 0.30.1 for development runs only.
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    runtimeOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    runtimeOnly "org.quiltmc:quilt-json5:1.0.4+final"
    runtimeOnly "org.quiltmc:quilt-config:1.3.3"
    runtimeOnly "org.ow2.asm:asm:9.10.1"
    runtimeOnly "org.ow2.asm:asm-analysis:9.10.1"
    runtimeOnly "org.ow2.asm:asm-commons:9.10.1"
    runtimeOnly "org.ow2.asm:asm-tree:9.10.1"
    runtimeOnly "org.ow2.asm:asm-util:9.10.1"

    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        transitive = false
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    inputs.property 'quilt_loader_dependency', project.quilt_loader_dependency
    inputs.property 'elib_version', project.elib_version
    filteringCharset = 'UTF-8'

    filesMatching('quilt.mod.json') {
        expand(
            version: project.version,
            minecraft_dependency: project.minecraft_dependency,
            quilt_loader_dependency: project.quilt_loader_dependency,
            elib_version: project.elib_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-quilt.jar"
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

tasks.named('runClient').configure {
    dependsOn tasks.named('jar')

    doFirst {
        def developmentMods = [tasks.named('jar').get().archiveFile.get().asFile]
        if (localElibJar.exists()) {
            developmentMods.add(localElibJar)
        }
        systemProperty 'loader.addMods', developmentMods.join(File.pathSeparator)
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-quilt"
            from components.java
        }
    }
}
